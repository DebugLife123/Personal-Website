server:
  # 默认本地开发端口 8090；服务器部署通过环境变量 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8090}

spring:
  # 敏感配置（数据库账号密码）放在 application-local.yml（已被 gitignore，不会提交），
  # 本地开发请复制 application-local.example.yml 为 application-local.yml 并填入真实密码；
  # 也可以通过环境变量 DB_USERNAME / DB_PASSWORD 注入。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/personal_website?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
